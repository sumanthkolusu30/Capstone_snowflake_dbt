models:
  - name: transformed_campaign_data
    description: "Transformed Campaign Data in Silver Schema."
    columns:
      - name: CAMPAIGN_ID
        description: "Primary Key of the table."
        data_tests:
          - unique
          - not_null
      - name: CAMPAIGN_NAME
        description: "Name of the Campaign."
        data_tests:
          - not_null
      - name: CAMPAIGN_TYPE
        description: "Type of the Campaign."
        data_tests:
          - not_null
      - name: START_DATE
        description: "The date the campaign began."
        data_tests:
          - not_null
      - name: END_DATE
        description: "The date the campaign ended."
        data_tests:
          - not_null
      - name: LAST_MODIFIED_DATE
        description: "Last Modified Date of the record."
        data_tests:
          - not_null
      - name: TOTAL_COST
        description: "Total cost of the campaign."
        data_tests:
          - not_null
      - name: BUDGET
        description: "Campaign budget as a float."
        data_tests:
          - not_null
      - name: TOTAL_REVENUE
        description: "Total revenue generated."
        data_tests:
          - not_null
      - name: EXPECTED_ROI
        description: "Calculated ROI: (Revenue - Cost) / Cost."
      - name: CHANNEL
        description: "The marketing channel used."
        data_tests:
          - not_null
      - name: AUDIENCE_LOCATION
        description: "Location of the Audience."
        data_tests:
          - accepted_values:
              arguments: 
                values: ['Urban', 'Suburban', 'All Areas', 'Campus']
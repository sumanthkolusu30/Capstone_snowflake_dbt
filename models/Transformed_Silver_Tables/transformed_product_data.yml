models:
  - name: transformed_product_data
    description: "Transformed Product Data in Silver Schema."
    columns:
      - name: PRODUCT_ID
        description: "Primary Key of the table."
        data_tests:
          - unique
          - not_null
      - name: PRODUCT_NAME
        description: "Name of the Product."
        data_tests:
          - not_null
      - name: BRAND
        description: "Brand of the Product."
        data_tests:
          - not_null
      - name: SUPPLIER_ID
        description: "SupplierID of the Product supplier."
        data_tests:
          - not_null
      - name: CATEGORY
        description: "Category of the Product."
        data_tests:
          - not_null
          - accepted_values:
              arguments: 
                values: ['Electronics']
      - name: SUBCATEGORY
        description: "Subcategory of the Product."
        data_tests:
          - not_null
          - accepted_values:
              arguments: 
                values: ['Mobile Devices', 'Computing', 'Imaging', 'Audio Devices', 'Wearable Tech']
      - name: PRODUCT_LINE
        description: "Product Line of the Product."
        data_tests:
          - not_null
          - accepted_values:
              arguments: 
                values: ['Gaming', 'Business', 'Ultra', 'Premium', 'Budget']
      - name: UNIT_PRICE
        description: "Unit Price of the Product."
        data_tests:
          - not_null
      - name: COST_PRICE
        description: "Cost Price of the Product."
        data_tests:
          - not_null
      
      